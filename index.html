<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlaç Takip ve Envanter</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: #16a34a; }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }
    .med-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .med-item:last-child { border-bottom: none; }
    .badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>💊 İlaç Takip & Envanter</h1>

  <!-- Barkod Tarama Alanı -->
  <div class="card">
    <button class="btn" onclick="startScanner()">📷 Barkod Tara ve İlaç Ekle</button>
    <div id="reader"></div>
  </div>

  <!-- İlaç Ekleme Formu -->
  <div class="card" id="formCard">
    <h3>İlaç Bilgileri</h3>
    <input type="text" id="barcode" placeholder="Barkod Numarası" readonly>
    <input type="text" id="medName" placeholder="İlaç Adı (Otomatik Aranıyor...)">
    <input type="number" id="stock" placeholder="Stok Adedi" value="1">
    <input type="text" id="shelf" placeholder="Raf / Dolap Konumu (Örn: A-1, Mutfak Dolabı)">
    <button class="btn btn-success" onclick="saveMedicine()">💾 Sisteme Kaydet</button>
  </div>

  <!-- Stok Listesi -->
  <div class="card">
    <h3>📋 Mevcut İlaç Stok Listesi</h3>
    <div id="medList">Henüz eklenmiş ilaç yok.</div>
  </div>

  <script>
    let html5QrcodeScanner = null;
    let inventory = JSON.parse(localStorage.getItem('ilac_envanter')) || [];

    renderList();

    function startScanner() {
      const readerDiv = document.getElementById('reader');
      readerDiv.style.display = 'block';

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        onScanSuccess
      ).catch(err => {
        alert("Kamera başlatılamadı: " + err);
        readerDiv.style.display = 'none';
      });
    }

    function onScanSuccess(decodedText) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader').style.display = 'none';
        });
      }

      document.getElementById('barcode').value = decodedText;
      fetchMedicineName(decodedText);
    }

    async function fetchMedicineName(barcode) {
      const nameInput = document.getElementById('medName');
      nameInput.value = "Sorgulanıyor...";

      try {
        // CORS proxy üzerinden ilactr.com sorgusu
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.ilactr.com/arama/?q=' + barcode)}`);
        const data = await res.json();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        const firstResult = doc.querySelector('.ilac-listesi a, .search-results a');

        if (firstResult && firstResult.innerText) {
          nameInput.value = firstResult.innerText.trim();
        } else {
          nameInput.value = "";
          nameInput.placeholder = "İlaç ismi bulunamadı, lütfen elle yazın";
        }
      } catch (e) {
        nameInput.value = "";
        nameInput.placeholder = "İlaç ismi manuel giriniz";
      }
    }

    function saveMedicine() {
      const barcode = document.getElementById('barcode').value;
      const name = document.getElementById('medName').value;
      const stock = document.getElementById('stock').value;
      const shelf = document.getElementById('shelf').value;

      if (!barcode || !name) {
        alert("Lütfen önce barkod taratın ve ilaç adını kontrol edin.");
        return;
      }

      const newItem = {
        id: Date.now(),
        barcode,
        name,
        stock: parseInt(stock) || 1,
        shelf: shelf || 'Belirtilmedi'
      };

      inventory.push(newItem);
      localStorage.setItem('ilac_envanter', JSON.stringify(inventory));

      // Formu Sıfırla
      document.getElementById('barcode').value = "";
      document.getElementById('medName').value = "";
      document.getElementById('stock').value = "1";
      document.getElementById('shelf').value = "";

      renderList();
      alert("İlaç başarıyla kaydoldu!");
    }

    function renderList() {
      const container = document.getElementById('medList');
      if (inventory.length === 0) {
        container.innerHTML = "Henüz kayıtlı ilaç bulunmuyor.";
        return;
      }

      container.innerHTML = inventory.map(item => `
        <div class="med-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>Barkod: ${item.barcode} | Konum: ${item.shelf}</small>
          </div>
          <span class="badge">${item.stock} Adet</span>
        </div>
      `).join('');
    }

    // Service Worker Kaydı
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
